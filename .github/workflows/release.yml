name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux-musl
            name: linux-musl-x64
          - os: ubuntu-22.04-arm
            target: aarch64-linux-musl
            name: linux-musl-arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute SOURCE_DATE_EPOCH
        id: sde
        shell: bash
        run: |
          # Derive from the tagged commit so packaging is reproducible.
          SDE=$(git log -1 --pretty=%ct "$GITHUB_SHA")
          echo "value=$SDE" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dstrip=true "-Dversion=${{ steps.version.outputs.version }}"

      - name: Package
        shell: bash
        run: |
          PKGNAME="zmx-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "$PKGNAME/bin"
          cp "zig-out/bin/zmx" "$PKGNAME/bin/"
          cp LICENSE README.md "$PKGNAME/" 2>/dev/null || true
          # Deterministic tar.gz: fixed mtimes, sorted entries, fixed
          # owner/group, gzip header with mtime=0. See scripts/pack.py.
          # SOURCE_DATE_EPOCH is set in the env from the tagged commit.
          python3 scripts/pack.py "$PKGNAME" "$PKGNAME.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            zmx-*.tar.gz
            zmx-*.tar.gz.sha256

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archives with cosign (per-asset sigstore bundles)
        env:
          # `cosign sign-blob` in unattended mode auto-accepts the
          # Fulcio identity prompt when COSIGN_YES is set, so this
          # step can run without manual intervention.
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in zmx-*.tar.gz; do
            cosign sign-blob \
              --bundle "${asset}.sigstore.json" \
              --output-signature /dev/null \
              --output-certificate /dev/null \
              "${asset}"
          done
          ls -la zmx-*.sigstore.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            zmx-*.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: zmx ${{ steps.version.outputs.version }}
          body: |
            zmx ${{ steps.version.outputs.version }}

            Linux binaries (musl, statically linked).

            Each archive has companion `.sha256` and `.sigstore.json`
            (keyless cosign bundle) sidecars. Build provenance is
            attested via GitHub Artifact Attestations.
          files: |
            zmx-*.tar.gz
            zmx-*.tar.gz.sha256
            zmx-*.sigstore.json
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
