name: CI

on:
  push:
    branches: [main, zig16]
  pull_request:
    branches: [main, zig16]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build --summary all

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build ReleaseSafe integration binary
        run: zig build -Doptimize=ReleaseSafe --prefix zig-out/integration --summary all

      - name: Install integration test runner
        run: sudo apt-get update -qq && sudo apt-get install -y bats

      - name: Run integration tests (ReleaseSafe)
        env:
          ZMX_TEST_BIN: ${{ github.workspace }}/zig-out/integration/bin/zmx
        run: bats test
